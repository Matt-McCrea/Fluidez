<!DOCTYPE html>
<html lang="ga">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Líofa</title>

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0b1311">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Líofa">

  <link rel="stylesheet" href="css/liofa.css">
</head>
<body>
  <!-- No header and no tab bar: the board IS the app, and a round takes the
       whole screen. See js/ga-arcade.js. Everything here is local to gaeilge/. -->
  <main class="app-main">
    <div id="stage-host"></div>
  </main>

  <script defer src="js/perf.js"></script>

  <!-- Irish rules, then the shared helpers and stores -->
  <script defer src="js/ga-text.js"></script>
  <script defer src="js/ga-core.js"></script>
  <script defer src="js/ui.js"></script>
  <script defer src="js/srs.js"></script>
  <script defer src="js/errorlog.js"></script>
  <script defer src="js/gamescore.js"></script>

  <!-- content: generated by tools/ga builds; each file may be empty and the app copes -->
  <script defer src="data/verbs.js"></script>
  <script defer src="data/words.js"></script>
  <script defer src="data/phrases.js"></script>
  <script defer src="data/cards.js"></script>
  <script defer src="data/gaps-briathra.js"></script>
  <script defer src="data/gaps-seimhiu.js"></script>
  <script defer src="data/gaps-forainm.js"></script>
  <script defer src="data/gaps-tais.js"></script>
  <script defer src="data/gaps-freagair.js"></script>

  <!-- items, then the round engine, the weekly check, the board -->
  <script defer src="js/ga-items.js"></script>
  <script defer src="js/gameround.js"></script>
  <script defer src="js/ga-check.js"></script>
  <script defer src="js/ga-arcade.js"></script>
</body>
</html>
