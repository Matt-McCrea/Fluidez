# Builds app/ from the rebuild branch and publishes it to the separate repo
# Matt-McCrea/fluidez-next, which serves it at
# https://matt-mccrea.github.io/fluidez-next/ for playtesting.
# The old app keeps https://matt-mccrea.github.io/Fluidez/ (Pages from main).
name: Publish rebuild to fluidez-next

on:
  push:
    branches: [rebuild]
    paths: ['app/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fluidez-next
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          BASE_PATH: /fluidez-next/
      - run: touch dist/.nojekyll
      - uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.FLUIDEZ_NEXT_DEPLOY_KEY }}
          external_repository: Matt-McCrea/fluidez-next
          publish_branch: gh-pages
          publish_dir: app/dist
          force_orphan: true
          commit_message: 'publish ${{ github.sha }}'
