<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Couramment</title>

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#f6efe1">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Couramment">

  <link rel="stylesheet" href="css/couramment.css">
</head>
<body>
  <!-- No header and no tab bar: the board IS the app, and a round takes the
       whole screen. See js/fr-arcade.js. Everything here is local to francais/. -->
  <main class="app-main">
    <div id="stage-host"></div>
  </main>

  <script defer src="js/perf.js"></script>

  <!-- French rules, then the shared helpers and stores -->
  <script defer src="js/fr-text.js"></script>
  <script defer src="js/fr-core.js"></script>
  <script defer src="js/ui.js"></script>
  <script defer src="js/srs.js"></script>
  <script defer src="js/errorlog.js"></script>
  <script defer src="js/gamescore.js"></script>

  <!-- content: generated by tools/fr builds; each file may be empty and the app copes -->
  <script defer src="data/verbs.js"></script>
  <script defer src="data/words.js"></script>
  <script defer src="data/phrases.js"></script>
  <script defer src="data/conversations.js"></script>
  <script defer src="data/convo-audio.js"></script>
  <script defer src="data/cards.js"></script>
  <script defer src="data/gaps-vb.js"></script>
  <script defer src="data/gaps-genre.js"></script>
  <script defer src="data/gaps-pron.js"></script>
  <script defer src="data/gaps-neg.js"></script>
  <script defer src="data/gaps-prep.js"></script>

  <!-- items, then the round engine, the weekly check, the board -->
  <script defer src="js/fr-items.js"></script>
  <script defer src="js/gameround.js"></script>
  <script defer src="js/fr-check.js"></script>
  <script defer src="js/convo-audio.js"></script>
  <script defer src="js/fr-convo.js"></script>
  <script defer src="js/fr-arcade.js"></script>
</body>
</html>
