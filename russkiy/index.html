<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Svobodno</title>

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#110c0b">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Svobodno">

  <link rel="stylesheet" href="css/svobodno.css">
</head>
<body>
  <!-- No header and no tab bar: the board IS the app, and a round takes the
       whole screen. See js/ru-arcade.js. Everything here is local to russkiy/. -->
  <main class="app-main">
    <div id="stage-host"></div>
  </main>

  <script defer src="js/perf.js"></script>

  <!-- Russian rules, then the shared helpers and stores -->
  <script defer src="js/ru-text.js"></script>
  <script defer src="js/ru-core.js"></script>
  <script defer src="js/ui.js"></script>
  <script defer src="js/srs.js"></script>
  <script defer src="js/errorlog.js"></script>
  <script defer src="js/gamescore.js"></script>
  <script defer src="js/ru-audio.js"></script>

  <!-- content: the letter course by hand, the rest generated; each file may be empty and the app copes -->
  <script defer src="data/letters.js"></script>
  <script defer src="data/audio.js"></script>
  <script defer src="data/verbs.js"></script>
  <script defer src="data/words.js"></script>
  <script defer src="data/phrases.js"></script>
  <script defer src="data/speak.js"></script>
  <script defer src="data/cards.js"></script>
  <script defer src="data/gaps-glagoly.js"></script>
  <script defer src="data/gaps-padezhi.js"></script>
  <script defer src="data/gaps-vid.js"></script>
  <script defer src="data/gaps-dvizhenie.js"></script>
  <script defer src="data/gaps-chisla.js"></script>

  <!-- items, then the round engine, stage 0, the weekly check, the board -->
  <script defer src="js/ru-items.js"></script>
  <script defer src="js/gameround.js"></script>
  <script defer src="js/ru-bukvy.js"></script>
  <script defer src="js/ru-speak.js"></script>
  <script defer src="js/ru-check.js"></script>
  <script defer src="js/ru-arcade.js"></script>
</body>
</html>
